name: CD - Build, Push to ECR and Deploy to EKS

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "**.md", "docs/**", "terraform/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-billing
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  SERVICE: billing
  NAMESPACE: billing
  APP_NAME: billing-service
  SMOKE_PATH: /billing/v1/info
  SMOKE_EXPECTED: "200"
  MANIFESTS: k8s/application
  KUBECTL_VERSION: v1.35.9

jobs:
  # Gate de verdade: workflows não dependem entre si, e sem este job um teste quebrado chegaria ao cluster.
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B clean verify

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Só funciona logo após o configure-aws-credentials: com token expirado ele falha antes de qualquer outro step.
      - name: Lab session expirada?
        if: failure()
        run: |
          echo "::error::Credencial do AWS Academy expirou ou esta invalida (a sessao dura ~4h)."
          echo "::error::Abra o lab, atualize ~/.aws/credentials e rode, no repo de plataforma:"
          echo "::error::  fiap-fase4-infra-k8s/scripts/refresh-gh-secrets.ps1 -Org CleytonOngaratto"
          echo "::error::O AWS_SESSION_TOKEN e obrigatorio; sem ele o erro vem como InvalidClientTokenId."

      - name: Check lab session
        run: aws sts get-caller-identity

      - name: Read platform contract from SSM
        run: |
          set -euo pipefail
          platform="fiap-fase4-infra-k8s - aplique a plataforma primeiro"

          read_param() {
            local value
            if ! value=$(aws ssm get-parameter --name "$1" --query Parameter.Value --output text 2>/dev/null); then
              echo "::error::SSM: parametro '$1' ausente. Quem publica: $platform" >&2
              return 1
            fi
            printf '%s' "$value"
          }

          ecr=$(read_param "/fase4/ecr/$SERVICE/repo-url")
          cluster=$(read_param /fase4/eks/cluster-name)
          alb_sg=$(read_param /fase4/alb/sg-id)
          topic=$(read_param /fase4/sns/billing-events/topic-arn)

          {
            echo "ECR_REPO=$ecr"
            echo "CLUSTER_NAME=$cluster"
            echo "ALB_SG_ID=$alb_sg"
            echo "BILLING_EVENTS_TOPIC_ARN=$topic"
            echo "IMAGE=${ecr}:${GITHUB_SHA}"
          } >> "$GITHUB_ENV"

          echo "ECR     : $ecr"
          echo "cluster : $cluster"
          echo "topico  : $topic"

      # Num merge com código e terraform/ os dois workflows rodam juntos, e o RDS leva ~10 min até publicar.
      - name: Wait for the service contract (SSM)
        run: |
          set -euo pipefail
          own="o terraform.yml deste repositorio (terraform/)"

          declare -A owners=(
            ["/fase4/$SERVICE/alb/target-group-arn"]="$own"
            ["/fase4/$SERVICE/rds/endpoint"]="$own"
            ["/fase4/$SERVICE/rds/port"]="$own"
            ["/fase4/$SERVICE/rds/db-name"]="$own"
            ["/fase4/$SERVICE/rds/username"]="$own"
            ["/fase4/$SERVICE/rds/password"]="$own"
            ["/fase4/$SERVICE/sqs/commands-queue-url"]="$own"
          )
          deadline=$((SECONDS + 1500))

          while :; do
            missing=()
            for p in "${!owners[@]}"; do
              aws ssm get-parameter --name "$p" > /dev/null 2>&1 || missing+=("$p")
            done
            if [ "${#missing[@]}" -eq 0 ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              for p in "${missing[@]}"; do
                echo "::error::SSM: parametro '$p' ausente depois de 25 min. Quem publica: ${owners[$p]}."
              done
              exit 1
            fi
            echo "aguardando: ${missing[*]}"
            sleep 20
          done

          read_param() {
            aws ssm get-parameter --name "$1" --query Parameter.Value --output text
          }

          tg=$(read_param "/fase4/$SERVICE/alb/target-group-arn")
          commands=$(read_param "/fase4/$SERVICE/sqs/commands-queue-url")

          {
            echo "TARGET_GROUP_ARN=$tg"
            echo "BILLING_COMMANDS_QUEUE_URL=$commands"
          } >> "$GITHUB_ENV"

          echo "target group : $tg"
          echo "fila comandos: $commands"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Tag = SHA do commit, nunca latest: com tag fixa o apply vira no-op e o rollout "passa" sem deployar nada.
      - name: Build and push image to ECR
        run: |
          set -euo pipefail
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Configure kubeconfig
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          kubectl config current-context

      # Ordem importa: apply -f <dir> é alfabético, e o ConfigMap precisa existir antes do Deployment.
      - name: Apply Namespace, ServiceAccount and ConfigMap
        run: |
          set -euo pipefail
          kubectl apply -f "$MANIFESTS/namespace.yaml"
          kubectl apply -f "$MANIFESTS/serviceaccount.yaml"

          for placeholder in __BILLING_COMMANDS_QUEUE_URL__ __BILLING_EVENTS_TOPIC_ARN__; do
            if ! grep -q "$placeholder" "$MANIFESTS/configmap.yaml"; then
              echo "::error::configmap.yaml sem o placeholder $placeholder - alguem hardcodou o valor?"
              exit 1
            fi
          done
          sed -e "s|__BILLING_COMMANDS_QUEUE_URL__|${BILLING_COMMANDS_QUEUE_URL}|" \
              -e "s|__BILLING_EVENTS_TOPIC_ARN__|${BILLING_EVENTS_TOPIC_ARN}|" \
            "$MANIFESTS/configmap.yaml" | kubectl apply -f -

      # Regenerados a todo deploy: a senha do RDS muda a cada apply do terraform.
      - name: Render Secrets from SSM
        run: |
          set -euo pipefail

          own="o terraform.yml deste repositorio (terraform/)"
          boot="bootstrap manual do dono; sobrevive ao destroy, nenhum Terraform o cria"

          ssm() {
            local name="$1" source="$2"
            shift 2
            local value
            if ! value=$(aws ssm get-parameter --name "$name" --query Parameter.Value \
                         --output text "$@" 2>/dev/null); then
              echo "::error::SSM: parametro '$name' ausente ou ilegivel. Quem publica: $source" >&2
              return 1
            fi
            printf '%s' "$value"
          }

          mask() { if [ -n "${1:-}" ]; then echo "::add-mask::$1"; fi; }

          db_host=$(ssm "/fase4/$SERVICE/rds/endpoint" "$own")
          db_port=$(ssm "/fase4/$SERVICE/rds/port"     "$own")
          db_name=$(ssm "/fase4/$SERVICE/rds/db-name"  "$own")
          db_user=$(ssm "/fase4/$SERVICE/rds/username" "$own")
          db_pass=$(ssm "/fase4/$SERVICE/rds/password" "$own" --with-decryption); mask "$db_pass"

          # O Billing valida o JWT e nunca o assina: a chave privada nao entra neste cluster.
          jwt_public=$(ssm /fase4/jwt/public-key "$boot" --with-decryption)

          mp_token=$(ssm /fase4/mercadopago/access-token "$boot" --with-decryption); mask "$mp_token"
          mp_secret=$(ssm /fase4/mercadopago/webhook-secret "$boot" --with-decryption)
          mask "$mp_secret"

          nr_key=$(aws ssm get-parameter --name /fase4/newrelic/license-key --with-decryption \
                   --query Parameter.Value --output text 2>/dev/null || true)
          mask "$nr_key"

          # ::add-mask:: não mascara valor multilinha: mascara-se o base64.
          # O $(...) come o newline final, e o PEM precisa dele: daí o printf '%s\n'.
          b64_jwt_public=$(printf '%s\n' "$jwt_public" | base64 -w0)
          b64_db_pass=$(printf '%s' "$db_pass" | base64 -w0); mask "$b64_db_pass"
          b64_mp_token=$(printf '%s' "$mp_token" | base64 -w0); mask "$b64_mp_token"
          b64_mp_secret=$(printf '%s' "$mp_secret" | base64 -w0); mask "$b64_mp_secret"

          apply_secret() {
            local name="$1"
            shift
            {
              echo "apiVersion: v1"
              echo "kind: Secret"
              echo "metadata:"
              echo "  name: $name"
              echo "  namespace: $NAMESPACE"
              echo "  labels:"
              echo "    app: $APP_NAME"
              echo "type: Opaque"
              echo "data:"
              printf '  %s\n' "$@"
            } | kubectl apply -f - > /dev/null
            echo "secret/$name - $# chave(s)"
          }

          apply_secret "$APP_NAME-db" \
            "DB_HOST: $(printf '%s' "$db_host" | base64 -w0)" \
            "DB_PORT: $(printf '%s' "$db_port" | base64 -w0)" \
            "DB_NAME: $(printf '%s' "$db_name" | base64 -w0)" \
            "DB_USERNAME: $(printf '%s' "$db_user" | base64 -w0)" \
            "DB_PASSWORD: $b64_db_pass"

          app_pairs=("MERCADOPAGO_ACCESS_TOKEN: $b64_mp_token"
                    "MERCADOPAGO_WEBHOOK_SECRET: $b64_mp_secret")
          if [ -n "$nr_key" ]; then
            app_pairs+=("NEW_RELIC_LICENSE_KEY: $(printf '%s' "$nr_key" | base64 -w0)")
          else
            echo "::warning::/fase4/newrelic/license-key ausente - a app sobe sem o agente (sem APM no New Relic)."
          fi
          apply_secret "$APP_NAME-app" "${app_pairs[@]}"

          apply_secret "$APP_NAME-jwt" "publicKey.pem: $b64_jwt_public"

      # Antes do Deployment: o controller só injeta o readiness gate em pod criado depois do binding.
      - name: Apply Service and TargetGroupBinding
        run: |
          set -euo pipefail
          kubectl apply -f "$MANIFESTS/service.yaml"

          for placeholder in __TARGET_GROUP_ARN__ __ALB_SG_ID__; do
            if ! grep -q "$placeholder" "$MANIFESTS/targetgroupbinding.yaml"; then
              echo "::error::targetgroupbinding.yaml sem o placeholder $placeholder - alguem hardcodou o valor?"
              exit 1
            fi
          done
          sed -e "s|__TARGET_GROUP_ARN__|${TARGET_GROUP_ARN}|" -e "s|__ALB_SG_ID__|${ALB_SG_ID}|" \
            "$MANIFESTS/targetgroupbinding.yaml" | kubectl apply -f -

      - name: Apply Deployment and HPA
        run: |
          set -euo pipefail

          before=$(kubectl -n "$NAMESPACE" get deploy "$APP_NAME" \
                   -o jsonpath='{.metadata.generation}' 2>/dev/null || true)

          if ! grep -q '__IMAGE__' "$MANIFESTS/deployment.yaml"; then
            echo "::error::deployment.yaml sem o placeholder __IMAGE__ - alguem hardcodou a URL do ECR?"
            exit 1
          fi
          sed "s|__IMAGE__|${IMAGE}|" "$MANIFESTS/deployment.yaml" | kubectl apply -f -
          kubectl apply -f "$MANIFESTS/hpa.yaml"

          after=$(kubectl -n "$NAMESPACE" get deploy "$APP_NAME" -o jsonpath='{.metadata.generation}')

          if [ -n "$before" ] && [ "$before" = "$after" ]; then
            echo "::notice::Spec do Deployment inalterado (imagem republicada sob a mesma tag): forcando rollout restart."
            kubectl -n "$NAMESPACE" rollout restart "deployment/$APP_NAME"
          fi

      - name: Wait for rollout
        run: kubectl -n "$NAMESPACE" rollout status "deployment/$APP_NAME" --timeout=600s

      - name: Smoke test - target group health
        run: |
          set -euo pipefail
          want=$(kubectl -n "$NAMESPACE" get deploy "$APP_NAME" -o jsonpath='{.spec.replicas}')

          for _ in $(seq 1 30); do
            healthy=$(aws elbv2 describe-target-health --target-group-arn "$TARGET_GROUP_ARN" \
                      --query "length(TargetHealthDescriptions[?TargetHealth.State=='healthy'])" --output text)
            total=$(aws elbv2 describe-target-health --target-group-arn "$TARGET_GROUP_ARN" \
                    --query "length(TargetHealthDescriptions)" --output text)
            echo "alvos healthy: $healthy de $total (replicas: $want)"
            if [ "$healthy" -ge "$want" ] && [ "$healthy" -eq "$total" ]; then
              exit 0
            fi
            sleep 10
          done

          aws elbv2 describe-target-health --target-group-arn "$TARGET_GROUP_ARN" --output table
          echo "::error::Os alvos do target group nao ficaram todos healthy em 5 min."
          exit 1

      - name: Smoke test - API Gateway
        run: |
          set -euo pipefail
          if ! api=$(aws ssm get-parameter --name /fase4/apigw/url --query Parameter.Value --output text 2>/dev/null); then
            echo "::notice::/fase4/apigw/url ausente (persistent/ do auth nao aplicado): smoke pelo Gateway pulado."
            exit 0
          fi

          code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$api$SMOKE_PATH" || true)
          if [ "$code" = "$SMOKE_EXPECTED" ]; then
            echo "GET $SMOKE_PATH pelo Gateway -> $code"
          elif [ "$code" = "404" ]; then
            echo "::notice::GET $SMOKE_PATH -> 404 no Gateway: a rota ainda nao existe (session/ do auth nao aplicado)."
          else
            echo "::error::GET $SMOKE_PATH pelo Gateway -> $code (esperado $SMOKE_EXPECTED)"
            exit 1
          fi

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "### Deploy no EKS"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Imagem | \`$IMAGE\` |"
            echo "| Cluster | \`$CLUSTER_NAME\` |"
            echo "| Namespace | \`$NAMESPACE\` |"
            echo ""
            echo '```'
            kubectl -n "$NAMESPACE" get pods,svc,hpa,targetgroupbindings
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
