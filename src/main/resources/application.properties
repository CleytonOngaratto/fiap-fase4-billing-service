quarkus.application.name=billing-service
quarkus.http.port=8080
quarkus.http.root-path=/billing/v1

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:billing_db}?sslmode=${DB_SSLMODE:disable}

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false

quarkus.flyway.enabled=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0.0.0

quarkus.sqs.aws.region=us-east-1
quarkus.sqs.aws.credentials.type=default
quarkus.sns.aws.region=us-east-1
quarkus.sns.aws.credentials.type=default
# Sem isto cada extensao sobe um LocalStack sozinha a cada @QuarkusTest, inclusive no CI. O SNS nao se
# protege por endpoint-override: o ElasticMQ nao emula SNS.
quarkus.sqs.devservices.enabled=false
quarkus.sns.devservices.enabled=false

billing.commands.queue-url=${BILLING_COMMANDS_QUEUE_URL:}
billing.events.topic-arn=${BILLING_EVENTS_TOPIC_ARN:}
billing.commands.batch-size=10
billing.outbox.relay.batch-size=10

mercadopago.base-url=${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.request-timeout=${MERCADOPAGO_REQUEST_TIMEOUT:PT10S}
mercadopago.fake=${MERCADOPAGO_FAKE:false}
mercadopago.max-attempts=${MERCADOPAGO_MAX_ATTEMPTS:3}
mercadopago.retry-backoff=${MERCADOPAGO_RETRY_BACKOFF:PT0.2S}
billing.events.publish-to-log=false

quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.info-title=Billing Service API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Orcamento a partir do diagnostico, aprovacao pelo cliente e pagamento no Checkout Pro do Mercado Pago. Participante da Saga orquestrada pelo OS Service.

mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:file:./secrets/publicKey.pem}
mp.jwt.verify.issuer=https://oficina-api.com
mp.jwt.verify.groups.path=groups
quarkus.security.jaxrs.deny-unannotated-endpoints=false

quarkus.log.console.json.enabled=true
quarkus.log.console.json.additional-field."service.name".value=billing-service
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:db;DB_CLOSE_DELAY=-1;
%test.quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
%test.quarkus.hibernate-orm.schema-management.strategy=create-drop
%test.quarkus.hibernate-orm.sql-load-script=import-test.sql
# A V1/V2 nao rodam em H2: tem indice parcial (WHERE sent_at IS NULL). Quem exerce a migracao e o
# Testcontainers com Postgres real.
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.http.port=9090
%test.quarkus.oidc.enabled=false
%test.quarkus.scheduler.enabled=false

%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.mp.jwt.verify.issuer=https://oficina-api.com
%test.smallrye.jwt.sign.key.location=privateKey.pem

# Chaves ficticias: o ElasticMQ nao as valida, e a cadeia padrao falharia no CI, que nao tem ~/.aws/credentials.
%test.quarkus.sqs.endpoint-override=http://localhost:9324
%test.quarkus.sqs.aws.credentials.type=static
%test.quarkus.sqs.aws.credentials.static-provider.access-key-id=elasticmq
%test.quarkus.sqs.aws.credentials.static-provider.secret-access-key=elasticmq
%test.quarkus.sns.aws.credentials.type=static
%test.quarkus.sns.aws.credentials.static-provider.access-key-id=sns-fake
%test.quarkus.sns.aws.credentials.static-provider.secret-access-key=sns-fake
%test.billing.commands.queue-url=http://localhost:9324/000000000000/billing-commands.fifo
%test.billing.events.topic-arn=arn:aws:sns:us-east-1:000000000000:billing-events.fifo
%test.mercadopago.fake=true
%test.mercadopago.access-token=test-access-token
%test.mercadopago.webhook-secret=test-webhook-secret
%test.mercadopago.retry-backoff=PT0S
%test.billing.events.publish-to-log=true

%dev.quarkus.sqs.endpoint-override=http://localhost:9324
%dev.quarkus.sqs.aws.credentials.type=static
%dev.quarkus.sqs.aws.credentials.static-provider.access-key-id=elasticmq
%dev.quarkus.sqs.aws.credentials.static-provider.secret-access-key=elasticmq
%dev.quarkus.sns.aws.credentials.type=static
%dev.quarkus.sns.aws.credentials.static-provider.access-key-id=sns-fake
%dev.quarkus.sns.aws.credentials.static-provider.secret-access-key=sns-fake
%dev.billing.commands.queue-url=http://localhost:9324/000000000000/billing-commands.fifo
%dev.billing.events.topic-arn=arn:aws:sns:us-east-1:000000000000:billing-events.fifo
%dev.mercadopago.base-url=http://localhost:8089
%dev.mercadopago.access-token=dev-access-token
%dev.mercadopago.webhook-secret=dev-webhook-secret
%dev.billing.events.publish-to-log=true
