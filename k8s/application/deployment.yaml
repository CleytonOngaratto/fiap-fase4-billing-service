# image: __IMAGE__ é trocado no deploy; aplicado cru, o pod entra em ImagePullBackOff.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: billing
  labels:
    app: billing-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
      # newrelic.io/scrape: o job default do agente ignora em silêncio quem não está na allowlist dele.
      annotations:
        newrelic.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/billing/v1/q/metrics"
    spec:
      serviceAccountName: billing-service
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: billing-service
          image: __IMAGE__
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          # O ALB segue mandando requisição por alguns segundos ao alvo que entrou em drenagem; sem a pausa, o rollout dá 5xx.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "35"]
          envFrom:
            - configMapRef:
                name: billing-service-config
            - secretRef:
                name: billing-service-db
            - secretRef:
                name: billing-service-app
          volumeMounts:
            - name: jwt-keys
              mountPath: /deployments/secrets
              readOnly: true
          startupProbe:
            httpGet:
              path: /billing/v1/q/health/live
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /billing/v1/q/health/live
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /billing/v1/q/health/ready
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              # Obrigatório: o HPA calcula o % sobre o request de CPU.
              cpu: 200m
              # 896Mi pela aritmética do HPA: com menos, o scale-down trava acima de target × (n−1)/n.
              memory: 896Mi
            limits:
              cpu: 500m
              # Igual ao request; é o teto do heap da JVM (MaxRAMPercentage 25%).
              memory: 896Mi
      volumes:
        - name: jwt-keys
          secret:
            secretName: billing-service-jwt
            defaultMode: 0440
